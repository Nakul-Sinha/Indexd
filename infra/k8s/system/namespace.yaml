apiVersion: v1
kind: Namespace
metadata:
  name: farlands-system
  labels:
    farlands.dev/role: system
    farlands.dev/shared: "true"
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: system-quota
  namespace: farlands-system
spec:
  hard:
    pods: "8"
    requests.cpu: "2"
    requests.memory: 4Gi
    persistentvolumeclaims: "4"
    requests.storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-and-dns
  namespace: farlands-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-team
          podSelector:
            matchLabels:
              app: velocity-proxy
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 25565
